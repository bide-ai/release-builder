name: Build release

# The reusable workflow that builds a bide release and attests it (SLSA v1 Build L3 provenance).
# bide's release.yml calls it, pinned by commit; nothing here can be changed by a change to bide.
#
# Isolation is the point. Two jobs, and the rules that keep the build away from the signing identity:
#   build   runs goreleaser (and so the build steps bide's repository defines: .goreleaser.yaml, its
#           hooks, the Go sources) with a read-only token and no id-token. It cannot mint the OIDC
#           token the attestation is signed with, and it has no attestations permission.
#   attest  has id-token and attestations: write, runs no code from the caller's repository (no
#           checkout), downloads what build uploaded, and attests only the files this workflow names.
# The certificate of each attestation names this file at the commit the caller pinned
# (job_workflow_ref), so a verifier that requires this repository, this path and that commit knows the
# provenance was made by these steps and not by anything in the caller's repository.
#
# Signing with cosign and publishing the release stay in bide's release.yml: they use bide's
# identity, so the signatures keep verifying as before. They run after the caller has verified the
# attestations made here.
on:
  workflow_call:
    inputs:
      go-version:
        description: 'The exact Go release the binaries are built with (1.X.Y)'
        type: string
        required: true
      snapshot:
        description: 'Build without a tag (goreleaser --snapshot); used by the manual dry run'
        type: boolean
        default: false
      attest:
        description: 'Attest the build. A build of a tag is always attested; a dry run does so only to rehearse (it writes to the public transparency log)'
        type: boolean
        default: true
    outputs:
      artifact:
        description: 'Name of the workflow artifact that holds the built files'
        value: release-dist

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: 'off'
      GO_VERSION: ${{ inputs.go-version }}
      SNAPSHOT: ${{ inputs.snapshot }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$GO_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]] || { echo "go-version '$GO_VERSION' is not 1.X.Y"; exit 1; }
          # A snapshot version under a release tag would be a build of the tag that is not the release.
          if [ "$SNAPSHOT" = true ] && [ "$GITHUB_REF_TYPE" = tag ]; then echo "snapshot is not allowed for a tag"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # GOTOOLCHAIN=local keeps the go command from switching to another toolchain; the version is
          # recorded in each binary, and bide's scripts/repro.sh rebuilds with the one it reads there.
          go-version: ${{ inputs.go-version }}
          cache: false
      - name: Pin the toolchain
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      # goreleaser and syft are downloaded at the versions named here and checked against the SHA-256
      # kept here, not taken as "the latest": they produce the files the attest job certifies. To move
      # to another version, change the URL and the checksum together (the checksum is in the
      # release's checksums file for the linux archive).
      - name: Install goreleaser and syft
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/bin"
          cd "$RUNNER_TEMP"
          fetch() { # fetch URL SHA256 MEMBER
            curl -fsSL --retry 3 -o tool.tgz "$1"
            echo "$2  tool.tgz" | sha256sum --check --strict
            tar -xzf tool.tgz -C tools/bin "$3"
            rm tool.tgz
          }
          fetch https://github.com/goreleaser/goreleaser/releases/download/v2.18.3/goreleaser_Linux_x86_64.tar.gz b8dee4728bca1aba0d71a832a17cd0a3799f75372878e7ffa36aef2343bce0bc goreleaser
          fetch https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47 syft
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Check the tools
        run: |
          goreleaser --version | head -n 3
          syft version | head -n 3
          goreleaser check
      # goreleaser builds the archives, the per-archive SBOMs and checksums.txt. It neither signs nor
      # publishes here: signing and publishing are the caller's, after the attestations verify.
      - name: Build
        run: |
          set -euo pipefail
          flags=(--clean "--skip=publish,sign")
          if [ "$SNAPSHOT" = true ]; then flags+=(--snapshot); fi
          goreleaser release "${flags[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The approve page's SHA256SUMS (approvals/cmd/approvepage), built from the same commit. Its
      # own SHA256SUMS is checked against the bundle it names before it is kept.
      - name: Approve page SHA256SUMS
        run: |
          set -euo pipefail
          go run ./approvals/cmd/approvepage -out approve-page
          (cd approve-page && sha256sum --check --strict SHA256SUMS)
          cp approve-page/SHA256SUMS approve-page.SHA256SUMS
      # Only these files leave the job, flat in one directory: the files attested below and the
      # changelog goreleaser generated. Each glob must match, so a build that produced nothing fails
      # here and not in the attest job.
      - name: Stage the files
        run: |
          set -euo pipefail
          mkdir out
          for g in 'dist/bide_*.tar.gz' 'dist/bide_*.tar.gz.sbom.json' dist/checksums.txt approve-page.SHA256SUMS; do
            found=0
            while IFS= read -r f; do cp -- "$f" out/; found=1; done < <(compgen -G "$g" || true)
            [ "$found" = 1 ] || { echo "no file matches $g"; exit 1; }
          done
          if [ -f dist/CHANGELOG.md ]; then cp dist/CHANGELOG.md out/CHANGELOG.md; fi
          ls -l out
      # overwrite: false: an artifact of this name that already exists (the build steps can upload
      # one with the run's token) makes this step, and so the release, fail: it can stop a release,
      # not alter what the attest job takes. The digest is in the run summary.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-dist
          path: out
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Record the artifact digest
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: echo "release-dist ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  attest:
    # A tag build is always attested, whatever the caller passes: attest false is for a dry run.
    if: inputs.attest || github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No checkout and no step that runs the caller's code: this job holds the signing identity.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: out
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/bide_*.tar.gz
            out/bide_*.tar.gz.sbom.json
            out/checksums.txt
            out/approve-page.SHA256SUMS
