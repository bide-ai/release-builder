name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actions are pinned by commit
        run: |
          .github/scripts/check-pinned-actions.sh --self-test
          .github/scripts/check-pinned-actions.sh
      - name: No floating tool versions
        run: |
          # Tools that make or lint the attested files are downloaded at a named version and checked
          # against a SHA-256 in the workflow (README rule 3), never "latest" or a range.
          if grep -rnE --exclude=ci.yml "goreleaser-action|version: *['\"]?(~>|latest)|/releases/latest" .github/workflows; then
            echo "a tool is floating or fetched without a pinned checksum"; exit 1
          fi
      - name: actionlint
        run: |
          set -euo pipefail
          # actionlint v1.7.7 by checksum, so the linter is not a moving target either.
          v=1.7.7
          curl -fsSL -o al.tgz "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_linux_amd64.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  al.tgz" | sha256sum --check --strict
          tar -xzf al.tgz actionlint
          ./actionlint
      - name: Version input check
        run: |
          # The module SBOM workflow's version check accepts vX.Y.Z and vX.Y.Z-rc.N and nothing looser.
          set -euo pipefail
          line=$(grep -F '=~ ^v' .github/workflows/module-sbom.yml | head -n 1)
          rx=$(sed -E 's/.*=~ (\^[^ ]+) \]\].*/\1/' <<<"$line")
          echo "regex: $rx"
          for v in v1.2.3 v0.21.0-rc.1 v1.0.0-alpha; do [[ "$v" =~ $rx ]] || { echo "refused $v"; exit 1; }; done
          for v in v1.2 v1.2.3x v1.2.3- 'v1.2.3-a b' 'v1.2.3-(x)' 1.2.3 'v1.2.3;rm' ''; do
            if [[ "$v" =~ $rx ]]; then echo "accepted '$v'"; exit 1; fi
          done
