name: Build module SBOM

# The reusable workflow that generates the SBOM of bide's published Go module set and attests it, in
# the same two-job shape as build.yml: the generation (scripts/module-sbom.sh from the caller's
# repository, syft, the public Go proxy) runs with a read-only token and no id-token; the attest job
# holds the signing identity and runs none of the caller's code. See build.yml for why that
# separation is what the L3 claim rests on. bide's release.yml signs the SBOM with cosign and
# attaches it after verifying the attestation.
on:
  workflow_call:
    inputs:
      go-version:
        description: 'The exact Go release used (1.X.Y)'
        type: string
        required: true
      version:
        description: 'The release tag (vX.Y.Z), or empty to use the latest release tag of the repository (the manual dry run)'
        type: string
        default: ''
      attest:
        description: 'Attest the SBOM (a release always does; a dry run only to rehearse)'
        type: boolean
        default: true
    outputs:
      artifact:
        description: 'Name of the workflow artifact that holds the SBOM'
        value: module-sbom

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: read
    env:
      GOWORK: 'off'
      GO_VERSION: ${{ inputs.go-version }}
      VERSION_IN: ${{ inputs.version }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$GO_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]] || { echo "go-version '$GO_VERSION' is not 1.X.Y"; exit 1; }
          [[ -z "$VERSION_IN" || "$VERSION_IN" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version '$VERSION_IN' is not vX.Y.Z"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false
      - name: Pin the toolchain
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      # syft is downloaded at the version named here and checked against the SHA-256 kept here (the
      # linux archive's, from the release's checksums file); change both together.
      - name: Install syft
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o syft.tgz https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz
          echo "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  syft.tgz" | sha256sum --check --strict
          tar -xzf syft.tgz -C tools/bin syft
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Module SBOM
        run: |
          set -euo pipefail
          v="$VERSION_IN"
          if [ -z "$v" ]; then v=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1); fi
          file="bide_${v#v}_modules.sbom.json"
          mkdir out
          scripts/module-sbom.sh "$v" "out/$file" --wait 240
          jq -r '.packages[] | "\(.name) \(.versionInfo)"' "out/$file" | sort | head -n 40
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-sbom
          path: out
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  attest:
    # A tag build is always attested, whatever the caller passes.
    if: inputs.attest || github.ref_type == 'tag'
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-sbom
          path: out
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/bide_*_modules.sbom.json
